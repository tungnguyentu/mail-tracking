<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MailTrack">
  <!-- Matches web .brand-mark: gradient 145deg #2F4FBF → #1A6B5C, white bars -->
  <defs>
    <linearGradient id="bg" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#2F4FBF"/>
      <stop offset="100%" stop-color="#1A6B5C"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="36" fill="url(#bg)"/>
  <!-- ::after bar at top 48%, left/right 28%, height ~8%; shadow 4px -4px -->
  <rect x="36" y="61" width="56" height="10" rx="5" fill="#fff"/>
  <rect x="56" y="41" width="56" height="10" rx="5" fill="#fff"/>
</svg>
